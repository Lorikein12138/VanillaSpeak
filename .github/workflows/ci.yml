name: 持续集成

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # src and scripts own server/shared contracts and command-line tools. Web tests,
  # including the web/test API integrations, belong to the frontend suite.
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: 安装后端依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 编译原生 Opus 依赖
        # Opus 0.10.0 lacks a matching prebuild for the runner's glibc.
        run: |
          node_root=$(node -p 'require("node:path").resolve(process.execPath, "../..")')
          if test -f "$node_root/include/node/node.h"; then
            export npm_config_nodedir="$node_root"
          fi
          npm_config_build_from_source=true npm rebuild @discordjs/opus --foreground-scripts --no-audit --no-fund
      - name: 后端测试
        run: npm run test:backend
      - name: 后端构建
        run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: 安装前端与集成测试依赖
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: 确认浏览器可执行
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          test -x "$chrome"
          "$chrome" --version
          printf 'WEBSPEAK_TEST_CHROME=%s\n' "$chrome" >> "$GITHUB_ENV"
      - name: 前端测试
        run: npm run test:frontend
      - name: 前端构建
        run: npm run web:build

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 构建部署镜像
        run: docker build --tag vanillaspeak-ci .
      - name: 创建隔离的容器
        id: create
        run: docker create --name vanillaspeak-ci --publish 127.0.0.1::3040 vanillaspeak-ci
      - name: 启动容器并验证健康端点与网页
        run: |
          docker start vanillaspeak-ci
          export SMOKE_ORIGIN="http://$(docker port vanillaspeak-ci 3040/tcp)"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';

          const origin = new URL(process.env.SMOKE_ORIGIN);
          const request = (path) => fetch(new URL(path, origin), {
            redirect: 'error',
            signal: AbortSignal.timeout(2000),
          });

          for (let attempt = 1; ; attempt++) {
            try {
              const response = await request('/health');
              assert.equal(response.status, 200, 'health endpoint status');
              assert.equal((await response.json()).status, 'ok', 'health response');
              break;
            } catch (error) {
              if (attempt === 20) throw error;
              await delay(1000);
            }
          }

          const page = await request('/join');
          assert.equal(page.status, 200, 'join page status');
          assert.match(page.headers.get('content-type') ?? '', /^text\/html\b/);
          const entry = (await page.text()).match(/<script\b[^>]*\bsrc="(\/assets\/[^"\s]+\.js)"/i)?.[1];
          assert.ok(entry, 'join page should reference a built JavaScript entry');
          const asset = await request(entry);
          assert.equal(asset.status, 200, 'entry asset status');
          assert.match(asset.headers.get('content-type') ?? '', /^(?:text|application)\/javascript\b/);
          assert.ok((await asset.text()).trim(), 'entry asset should be nonempty');
          NODE
      - name: 读取失败容器日志
        if: ${{ failure() && steps.create.outcome == 'success' }}
        run: docker logs vanillaspeak-ci
      - name: 清理容器与临时数据卷
        if: ${{ always() && steps.create.outcome == 'success' }}
        run: docker rm --force --volumes vanillaspeak-ci

  # Add or remove independent checks here and in the expected jobs below.
  # Keep ci-required stable when registering it as a branch ruleset check.
  ci-required:
    name: ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [backend, frontend, docker-smoke]
    if: ${{ always() }}
    steps:
      - name: 核对所有必需作业均成功
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['backend', 'frontend', 'docker-smoke'];
          const results = JSON.parse(process.env.RESULTS);
          if (!results || Array.isArray(results) || typeof results !== 'object') {
            throw new Error('Missing or invalid CI job results');
          }
          const jobs = new Set([...required, ...Object.keys(results)]);
          for (const job of jobs) {
            const result = results[job]?.result ?? 'missing';
            console.log(`${job}: ${result}`);
            if (result !== 'success') process.exitCode = 1;
          }
          NODE
